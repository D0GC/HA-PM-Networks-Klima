[tool.ruff]
target-version = "py313"
line-length = 100
# wörtlicher Auszug aus HA 2026.9.3 (Annotationen bewusst unaufgelöst)
extend-exclude = ["tests/fixtures/ha_2026_9_3_device_registry.py", "tools/screenshots"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC", "PL"]
ignore = ["E501", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004", "RUF001", "RUF002", "RUF003", "PLC0415"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components.pm_heizung"]
combine-as-imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["allow_errors: Test erzeugt absichtlich Fehlermeldungen"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
check_untyped_defs = true
